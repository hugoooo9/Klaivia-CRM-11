# Auto-deploy sur Hostinger VPS à chaque push sur main.
# Prérequis : définir 3 secrets dans GitHub → Settings → Secrets → Actions :
#   HOSTINGER_HOST  = IP du VPS
#   HOSTINGER_USER  = utilisateur SSH (ex. "root")
#   HOSTINGER_SSH_KEY = clé privée SSH (contenu complet de ~/.ssh/id_rsa)

name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/klaivia-crm
            git pull origin main
            npm install --production=false
            npx prisma migrate deploy
            npx prisma generate
            npm run build
            pm2 restart klaivia-crm
            echo "✅ Déployé à $(date)"
